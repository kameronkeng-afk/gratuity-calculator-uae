name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q "gratuity-calculator-uae-fixed (1).zip" -d extracted/
          ls -la extracted/

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Find and build project
        run: |
          GRADLE_DIR=$(find extracted/ -name "gradlew" | head -1 | xargs dirname)
          echo "Found project at: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GratuityCalculatorUAE
          path: "**/*.apk"
          retention-days: 30
