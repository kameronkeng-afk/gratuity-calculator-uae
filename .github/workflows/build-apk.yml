name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP and find project
        run: |
          unzip -q "gratuity-calculator-uae-fixed (1).zip" -d extracted/
          echo "=== Folders found ==="
          ls extracted/
          PROJECT_DIR=$(find extracted/ -name "build.gradle" | grep -v "/app/" | head -1 | xargs dirname)
          echo "Project dir: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd $PROJECT_DIR
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GratuityCalculatorUAE
          path: "extracted/**/app/build/outputs/apk/debug/*.apk"
          retention-days: 30
