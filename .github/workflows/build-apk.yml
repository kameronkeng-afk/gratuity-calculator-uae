name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project ZIP
        run: |
          unzip -q "gratuity-calculator-uae-fixed (1).zip" -d extracted/
          echo "=== Extracted contents ==="
          find extracted/ -type f | head -30

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Add Gradle Wrapper
        run: |
          cd extracted/GratuityUAE
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd extracted/GratuityUAE
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GratuityCalculatorUAE-debug
          path: "extracted/**/*.apk"
          retention-days: 30
